name: Scheduled Feed Sync

# Sync Bluesky + GitHub activity archives hourly.
# New items are committed to the repo, which triggers deploy.yml via push.
on:
  schedule:
    # Every hour at :05 past the hour (UTC)
    - cron: '5 * * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-feeds:
    name: Sync feed archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync feeds
        run: node scripts/sync-feeds.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new feed items."
          else
            git commit -m "chore: sync feed archives"
            git push
          fi
