name: Scheduled Feed Sync

# Sync Bluesky + GitHub activity archives hourly.
# New items are committed to the repo; if anything changed, the deploy job
# calls deploy.yml directly to rebuild and publish the site.
on:
  schedule:
    # Every hour at :05 past the hour (UTC)
    - cron: '5 * * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-feeds:
    name: Sync feed archives
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync feeds
        run: node scripts/sync-feeds.js

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new feed items."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync feed archives"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy synced site
    needs: sync-feeds
    if: needs.sync-feeds.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
