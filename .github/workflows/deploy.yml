name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Called by the Scheduled Feed Sync workflow after it pushes new feed items.
  # (A push made with the built-in GITHUB_TOKEN can't trigger this via `push`.)
  workflow_call:

# Sets permissions so the workflow can write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs on new pushes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # Always build the current tip of main. When called from the feed sync
          # workflow, github.sha still points at the pre-sync commit, so pin to
          # the branch to pick up the just-pushed feed items.
          ref: main

      - name: Check for layout/style changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
              'app.vue' 'layouts/' 'components/' 'pages/' 'composables/' \
              'assets/' 'nuxt.config.ts' 'content.config.ts' \
              'e2e/' 'playwright.config.ts' 'server/')
            if [ -n "$CHANGED" ]; then
              echo "e2e=true" >> "$GITHUB_OUTPUT"
            else
              echo "e2e=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate static site
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_GROWTHBOOK_CLIENT_KEY: ${{ secrets.NUXT_PUBLIC_GROWTHBOOK_CLIENT_KEY }}
          NUXT_PUBLIC_MIDA_PROJECT_KEY: ${{ secrets.NUXT_PUBLIC_MIDA_PROJECT_KEY }}

      - name: Install Playwright
        if: steps.changes.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.changes.outputs.e2e == 'true'
        run: npx playwright test

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4